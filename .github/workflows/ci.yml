name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every interpreter on ubuntu, and only 3.12 on macOS/Windows: six jobs
      # cover the version range once and the other two platforms where it matters.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (editable, with the optional extras)
        run: 'python -m pip install -e ".[yaml,dev]"'
      # The test bootstrap writes its scratch directories under build/ and never
      # to TMPDIR, so this workflow sets no temp-directory override on purpose.
      - name: Tests
        run: python -m pytest tests -q
      # The Status section of both READMEs claims the console script runs; this
      # is the step that makes that claim true on every platform in the matrix.
      - name: Console script
        run: agenttwin --version && agenttwin gallery list

  stdlib-only:
    name: stdlib-only import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Drop PyYAML so the job really proves zero third-party imports
        run: python -m pip uninstall -y pyyaml
      - name: Install without dependencies
        run: python -m pip install -e . --no-deps
      - name: Import the public API with nothing else installed
        run: python -c "import sys, agenttwin; agenttwin.Twin; assert 'yaml' not in sys.modules, 'pyyaml was imported'; print('agenttwin', agenttwin.__version__)"
