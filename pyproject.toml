[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttwin"
version = "0.1.0"
description = "Frozen-replay for LLM agents: record one JSONL tape, replay it deterministically, diff what changed."
requires-python = ">=3.10"
keywords = ["llm", "agents", "replay", "record", "determinism", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest>=7"]

[project.scripts]
agenttwin = "agenttwin.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenttwin = ["html/*.html", "fixtures/*.jsonl"]
